name: Build pinned Steel image

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build-pinned-image:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact reviewed Steel source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push pinned linux/amd64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/daisuke134/steel-browser:sha-${{ github.event.pull_request.head.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.event.pull_request.head.sha }}
            org.opencontainers.image.source=https://github.com/Daisuke134/steel-browser
